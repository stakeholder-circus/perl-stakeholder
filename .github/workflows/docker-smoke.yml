name: docker-smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t perl-stakeholder .
      - name: List values
        run: docker run --rm perl-stakeholder --list-values
      - name: JSON smoke
        run: docker run --rm perl-stakeholder --output-format json --focus-family code_analyzer --seed 123
      - name: Experimental provider fail-fast
        run: |
          set +e
          docker run --rm perl-stakeholder --experimental-provider local-demo
          status=$?
          test "$status" -eq 2
