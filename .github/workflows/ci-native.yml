name: ci-native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax
        run: perl -c bin/stakeholder.pl
      - name: Run tests
        run: prove -Ilib t
      - name: Contract smoke
        run: perl -Ilib bin/stakeholder.pl --output-format json --focus-family code_analyzer --seed 123
